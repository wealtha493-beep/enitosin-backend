services:
  - type: web
    name: enitosin-store
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health   # Render pings this; if it stops answering, Render restarts the app
    envVars:
      - key: ADMIN_KEY
        sync: false   # set this yourself in the Render dashboard — don't commit a real key
      - key: SUPABASE_URL
        sync: false   # Supabase project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # Supabase secret/service-role key — NEVER expose in frontend code
      - key: RESEND_API_KEY
        sync: false   # your Resend API key (starts with "re_")
      - key: RESEND_FROM_EMAIL
        sync: false   # optional — e.g. "ENITOSIN Store <orders@yourdomain.com>" once you verify a domain on Resend
      - key: PAYSTACK_SECRET_KEY
        sync: false   # from Paystack dashboard -> Settings -> API Keys & Webhooks (sk_test_... while testing)
      - key: SESSION_SECRET
        generateValue: true   # Render creates a long random secret for customer logins
      - key: NODE_VERSION
        value: "22"   # Node 20 reached end-of-life on 30 April 2026, so use a supported version
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false   # your live site address, e.g. https://enitosin-store.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false   # optional — only if another website must call this API

# NOTE: Products, orders, customers, settings, and activity logs are now
# persisted in Supabase. Render only runs the Node/Express backend, so a
# Render persistent disk is not required for the store database.
