services:
  - type: web
    name: enitosin-store
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_KEY
        sync: false   # set this yourself in the Render dashboard — don't commit a real key
      - key: RESEND_API_KEY
        sync: false   # your Resend API key (starts with "re_")
      - key: RESEND_FROM_EMAIL
        sync: false   # optional — e.g. "ENITOSIN Store <orders@yourdomain.com>" once you verify a domain on Resend
      - key: NODE_VERSION
        value: 20.11.0

# NOTE: Free-tier Render web services have an ephemeral filesystem — the
# data/*.json files (products, orders, logs) are wiped on every restart or
# redeploy. To keep data across deploys, upgrade to a paid instance type
# and attach a persistent disk (see README.md for the exact steps), or
# swap the JSON-file storage for Render Postgres.
